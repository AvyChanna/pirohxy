default_job = "clippy-all"
env.CARGO_TERM_COLOR = "always"

[jobs.clippy-all]
command = ["cargo", "clippy", "--all-targets"]
need_stdout = false

[jobs.run]
command = ["cargo", "run"]
need_stdout = true
allow_warnings = true
background = true

# The same command in the foreground instead of the background pane: use `run` for
# `pirohxy egress`, where a restart on every edit is what you want, and `run-long` for a
# CLI command whose output you actually want to read.
[jobs.run-long]
command = ["cargo", "run"]
need_stdout = true
allow_warnings = true
background = false
on_change_strategy = "kill_then_restart"

[jobs.test]
command = ["cargo", "nextest", "run", "--all-targets"]
need_stdout = true

[jobs.bacon-ls]
command = [
    "cargo",
    "clippy",
    "--tests",
    "--all-targets",
    "--all-features",
    "--message-format",
    "json-diagnostic-rendered-ansi",
]
analyzer = "cargo_json"
need_stdout = true

